[workspace]
name = "bsc-windows-build"
version = "0.1.0"
description = "Reproducible native Windows build environment for BSC"
channels = [
  "https://mirrors.ustc.edu.cn/anaconda/cloud/conda-forge",
  "https://repo.anaconda.com/pkgs/msys2",
]
platforms = ["win-64"]

[dependencies]
ccache = "4.13.*"
ghcup = "0.1.18.*"
just = ">=1.40,<2"
python = ">=3.12,<3.15"
rust = ">=1.95,<2"
z3prover = ">=4.13,<5"
m2-base = "1.*"
m2-diffutils = "3.*"
m2-git = "2.8.*"
m2-make = "4.*"
m2-pkg-config = "0.29.*"
m2w64-gmp = "6.*"
m2w64-tcl = "8.6.*"
m2w64-toolchain = "5.3.*"

[target.win-64.activation]
scripts = ["util/windows/activate.bat"]
