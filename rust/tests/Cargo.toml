[package]
name = "bsc-rust-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
bluesim = { path = "../bluesim" }
bsc-test-plan = { path = "../util/test-plan" }
bsc-testsuite-manifest = { path = "../util/testsuite-manifest" }
clap = { version = "4.5", features = ["derive"] }
filetime = "0.2"
process-wrap = { version = "9.1", default-features = false, features = ["std", "job-object", "process-group"] }
rayon = "1.11"
regex = "1.12"
serde_json = "1"
sha2 = "0.10"
vcd = "0.7"
