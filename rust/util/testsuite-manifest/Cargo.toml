[package]
name = "bsc-testsuite-manifest"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
bsc-test-plan = { path = "../test-plan" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tree-sitter = "0.25"
tree-sitter-tcl = { git = "https://github.com/tree-sitter-grammars/tree-sitter-tcl", rev = "8f11ac7206a54ed11210491cee1e0657e2962c47" }
walkdir = "2.5"
